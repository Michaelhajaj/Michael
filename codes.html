<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>קודי פתיחה</title>
<style>
:root{--bg:#f4f0e8;--ink:#161613;--line:rgba(0,0,0,.15);--acc:#c9a55c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161613;--ink:#f4f0e8;--line:rgba(255,255,255,.18)}}
:root[data-theme="dark"]{--bg:#161613;--ink:#f4f0e8;--line:rgba(255,255,255,.18)}
body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif;margin:0;padding:24px 16px;max-width:820px;margin-inline:auto}
textarea{width:100%;box-sizing:border-box;min-height:180px;font:13px monospace;direction:ltr;background:transparent;color:inherit;border:1px solid var(--line);padding:8px}
button{background:var(--acc);border:0;padding:10px 18px;font:inherit;cursor:pointer}
input{padding:8px;width:80px;font:inherit}
</style>
</head>
<body>
<h1>מחולל קודי פתיחה – מתכנן הגבס</h1>
<p>1. לוחצים "ייצור". 2. את <b>הקודים</b> שומרים אצלכם (בטלפון / בפתקים) – כל לקוח ששילם מקבל קוד אחד.
3. את <b>הטביעות</b> מדביקים בקובץ <code>js/config.js</code> בתוך <code>unlockHashes: [ ... ]</code>.</p>
<p>כמות: <input id="n" type="number" value="50" min="1" max="500"> <button id="go">ייצור</button></p>
<h3>קודים (לשמור אצלכם, לא להעלות לאתר)</h3><textarea id="codes" readonly></textarea>
<h3>טביעות (להדביק ב-config.js)</h3><textarea id="hashes" readonly></textarea>
<h3>בדיקת קוד קיים</h3><p><input id="one" style="width:180px;direction:ltr"> <button id="hashOne">טביעה</button> <code id="oneOut" style="direction:ltr;word-break:break-all"></code></p>
<script>
const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const code=()=>{const r=crypto.getRandomValues(new Uint8Array(8));return [...r].map(x=>A[x%A.length]).join("").replace(/^(.{4})/,"$1-")};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,"0")).join("");
document.getElementById("go").onclick=async()=>{const n=Math.min(500,+document.getElementById("n").value||50);const cs=Array.from({length:n},code);
document.getElementById("codes").value=cs.join("\n");document.getElementById("hashes").value=(await Promise.all(cs.map(sha))).map(h=>`"${h}"`).join(",\n");};
document.getElementById("hashOne").onclick=async()=>{document.getElementById("oneOut").textContent=await sha(document.getElementById("one").value.trim().toUpperCase());};
</script>
</body>
</html>
